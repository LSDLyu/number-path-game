<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#74c8f4">
  <meta name="lisa-version" content="2026-09-20-word-play">
  <meta name="description" content="适合6岁儿童的绘本风字母启蒙横版闯关游戏">
  <title>Lisa的字母冒险</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2374c8f4'/%3E%3Cpath d='M15 49 28 14h8l13 35h-9l-3-9H25l-3 9Zm13-17h7l-3.5-11Z' fill='white'/%3E%3Ccircle cx='50' cy='14' r='7' fill='%23ffcf4a'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #173a5a;
      --paper: #fffaf0;
      --sky: #74c8f4;
      --coral: #ff665c;
      --yellow: #ffd84f;
      --blue: #4b9fe6;
      --mint: #62c69f;
      --shadow: rgba(22, 55, 83, .25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: linear-gradient(180deg, #a8e2ff 0%, #e8f8ff 48%, #5ea68a 100%);
      color: var(--ink);
      font-family: "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
    }

    .game-shell {
      position: relative;
      width: min(100vw, calc(100dvh * 16 / 9));
      height: min(100dvh, calc(100vw * 9 / 16));
      max-width: 1280px;
      max-height: 720px;
      overflow: hidden;
      border-radius: clamp(0px, 1.5vw, 24px);
      background: #8bd3f5;
      box-shadow: 0 18px 70px rgba(15, 52, 75, .35);
      isolation: isolate;
      touch-action: none;
    }

    .playfield {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hero-sprite {
      position: absolute;
      z-index: 2;
      width: 8.15%;
      height: 16.7%;
      object-fit: fill;
      object-position: center;
      pointer-events: none;
      user-select: none;
      transform: translate(-50%, -100%);
      transform-origin: 50% 100%;
      filter: drop-shadow(0 4px 4px rgba(40, 45, 55, .22));
      will-change: left, top, transform, opacity;
    }

    .top-hud {
      position: absolute;
      inset: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) auto max(12px, env(safe-area-inset-left));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 5;
    }

    .hearts {
      display: flex;
      gap: clamp(5px, 1vw, 12px);
      min-height: 48px;
      padding: 7px 11px;
      border: 3px solid rgba(255, 255, 255, .9);
      border-radius: 999px;
      background: rgba(255, 250, 240, .82);
      box-shadow: 0 5px 0 rgba(31, 72, 101, .16);
      backdrop-filter: blur(8px);
    }

    .heart {
      display: grid;
      place-items: center;
      width: clamp(27px, 4vw, 46px);
      aspect-ratio: 1;
      color: #ef3c48;
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1;
      filter: drop-shadow(0 2px 0 #a9192d);
      transform-origin: center;
      transition: opacity .25s ease, filter .25s ease, transform .25s ease;
    }

    .heart.lost {
      opacity: .22;
      filter: grayscale(1);
      transform: scale(.76);
    }

    .heart.hurt {
      animation: heart-shake .42s ease;
    }

    .heart.healed {
      animation: heart-pop .62s cubic-bezier(.2, 1.7, .35, 1);
    }

    @keyframes heart-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px) rotate(-8deg); }
      50% { transform: translateX(5px) rotate(7deg); }
      75% { transform: translateX(-3px) rotate(-4deg); }
    }

    @keyframes heart-pop {
      0% { transform: scale(.55); }
      45% { transform: scale(1.42) rotate(-8deg); }
      72% { transform: scale(.92) rotate(4deg); }
      100% { transform: scale(1); }
    }

    .hud-actions {
      display: flex;
      gap: 9px;
      pointer-events: auto;
    }

    .icon-btn {
      width: clamp(44px, 6vw, 62px);
      aspect-ratio: 1;
      border: 3px solid white;
      border-radius: 50%;
      background: rgba(255, 250, 240, .9);
      color: var(--ink);
      box-shadow: 0 5px 0 rgba(31, 72, 101, .22);
      font-size: clamp(21px, 3vw, 31px);
      cursor: pointer;
    }

    .icon-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(31, 72, 101, .22);
    }

    .level-pill {
      position: absolute;
      top: max(13px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 8px 18px;
      border: 3px solid white;
      border-radius: 999px;
      background: rgba(255, 250, 240, .84);
      box-shadow: 0 5px 0 rgba(31, 72, 101, .16);
      font-size: clamp(14px, 2.2vw, 22px);
      white-space: nowrap;
      pointer-events: none;
    }

    .coach {
      position: absolute;
      top: 18%;
      left: 50%;
      z-index: 6;
      max-width: min(82%, 540px);
      padding: 11px 20px;
      border: 3px solid white;
      border-radius: 20px;
      background: rgba(23, 58, 90, .86);
      color: white;
      box-shadow: 0 6px 0 rgba(10, 31, 48, .25);
      font-size: clamp(15px, 2.2vw, 23px);
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, -12px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .coach.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .letter-card {
      position: absolute;
      top: 16%;
      left: 50%;
      z-index: 7;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) clamp(58px, 16vw, 84px);
      align-items: center;
      gap: 5px 14px;
      width: min(88vw, 430px);
      padding: 13px 18px;
      border: 4px solid white;
      border-radius: 26px;
      background: rgba(255, 250, 240, .96);
      box-shadow: 0 9px 0 rgba(31, 72, 101, .2);
      opacity: 0;
      transform: translate(-50%, -20px) scale(.85);
      transition: opacity .22s ease, transform .28s cubic-bezier(.2, 1.5, .4, 1);
      pointer-events: none;
    }

    .letter-card.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      pointer-events: auto;
    }

    .letter-big {
      grid-row: 1;
      grid-column: 1;
      color: var(--coral);
      font-size: clamp(52px, 7vw, 88px);
      line-height: 1;
      text-shadow: 0 4px 0 #ffc2a9;
    }

    .letter-sound {
      display: block;
      font-size: clamp(18px, 2.4vw, 26px);
    }

    .letter-word {
      display: block;
      color: #267455;
      font-size: clamp(17px, 2.2vw, 24px);
      text-transform: capitalize;
      overflow-wrap: anywhere;
    }

    .letter-copy {
      grid-column: 2;
      min-width: 0;
    }

    .letter-doodle {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 3px 0 rgba(31, 72, 101, .12));
    }
    .doodle-frame { grid-column: 3; width: 100%; aspect-ratio: 1; position: relative; }
    .doodle-fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; }
    .doodle-fallback[hidden], .letter-doodle[hidden] { display: none; }

    .letter-bonus {
      display: block;
      margin-top: 3px;
      color: #e63d57;
      font-size: clamp(14px, 1.9vw, 18px);
      font-weight: 800;
    }

    .letter-replay {
      grid-column: 1 / -1;
      justify-self: center;
      margin-top: 3px;
      padding: 5px 12px;
      border: 0;
      border-radius: 999px;
      background: #e7f4ff;
      color: #24577b;
      font: inherit;
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 800;
      pointer-events: auto;
      cursor: pointer;
    }

    .letter-replay:active {
      transform: translateY(2px);
    }

    .controls {
      position: absolute;
      inset: auto max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
    }

    .dpad {
      position: relative;
      width: clamp(132px, 20vw, 184px);
      aspect-ratio: 1;
      border: 5px solid rgba(255, 255, 255, .88);
      border-radius: 50%;
      background: rgba(74, 157, 226, .72);
      box-shadow: 0 9px 0 rgba(19, 72, 112, .25);
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }

    .control-btn {
      position: absolute;
      display: grid;
      place-items: center;
      width: 34%;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 253, 244, .96);
      color: #28608e;
      box-shadow: 0 5px 0 rgba(31, 72, 101, .22);
      font-size: clamp(24px, 4.2vw, 42px);
      line-height: 1;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-btn[data-action="up"] { top: 5%; left: 33%; }
    .control-btn[data-action="down"] { bottom: 5%; left: 33%; }
    .control-btn[data-action="left"] { left: 5%; top: 33%; }
    .control-btn[data-action="right"] { right: 5%; top: 33%; }

    .control-btn.active,
    .control-btn:active {
      transform: translateY(4px) scale(.96);
      box-shadow: 0 1px 0 rgba(31, 72, 101, .22);
      background: #fff2b1;
    }

    .jump-btn {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(112px, 17vw, 164px);
      aspect-ratio: 1;
      border: 6px solid rgba(255, 255, 255, .92);
      border-radius: 50%;
      background: rgba(255, 205, 55, .9);
      color: white;
      box-shadow: 0 10px 0 rgba(166, 112, 13, .32);
      font-size: clamp(50px, 8vw, 82px);
      line-height: 1;
      text-shadow: 0 4px 0 rgba(166, 112, 13, .3);
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .jump-btn::after {
      content: "长按跳高";
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      color: #75550f;
      font-size: clamp(11px, 1.5vw, 16px);
      text-shadow: none;
      white-space: nowrap;
    }

    .jump-btn.active,
    .jump-btn:active {
      transform: translateY(6px) scale(.97);
      box-shadow: 0 3px 0 rgba(166, 112, 13, .32);
      background: #ffbd34;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(23, 58, 90, .28);
      backdrop-filter: blur(7px);
      transition: opacity .35s ease, visibility .35s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .panel {
      width: min(88%, 560px);
      padding: clamp(24px, 5vw, 48px);
      border: 5px solid white;
      border-radius: 38px;
      background: rgba(255, 250, 240, .96);
      box-shadow: 0 14px 0 rgba(31, 72, 101, .24);
      text-align: center;
    }

    .panel h1,
    .panel h2 {
      margin: 0 0 12px;
      color: #174f79;
      font-size: clamp(32px, 6vw, 58px);
      line-height: 1.1;
    }

    .panel p {
      margin: 0 0 22px;
      color: #355d76;
      font-size: clamp(16px, 2.5vw, 23px);
      line-height: 1.55;
    }

    .start-btn {
      min-width: min(100%, 300px);
      min-height: 68px;
      padding: 14px 28px;
      border: 4px solid white;
      border-radius: 999px;
      background: var(--coral);
      color: white;
      box-shadow: 0 8px 0 #b93239;
      font-size: clamp(24px, 4vw, 36px);
      cursor: pointer;
    }

    .start-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b93239;
    }

    .how {
      display: inline-flex;
      gap: 8px;
      margin-top: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e6f5ff;
      color: #28608e;
      font-size: clamp(13px, 2vw, 18px);
    }

    .rotate-tip {
      display: none;
      position: absolute;
      inset: auto 50% calc(170px + env(safe-area-inset-bottom)) auto;
      z-index: 20;
      transform: translateX(50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(23, 58, 90, .84);
      color: white;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .level-pill { display: none; }
      .top-hud { top: 7px; }
      .hearts { padding: 4px 7px; border-width: 2px; }
      .icon-btn { border-width: 2px; }
      .dpad { border-width: 3px; }
      .jump-btn { border-width: 4px; }
      .jump-btn::after { display: none; }
    }

    @media (orientation: portrait) and (max-width: 820px) {
      body { place-items: stretch; }
      .game-shell {
        width: 100vw;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        background: linear-gradient(180deg, #8bd3f5 0 57vw, #d7f3e5 57vw 100%);
      }
      .playfield {
        bottom: auto;
        height: auto;
        aspect-ratio: 16 / 9;
      }
      canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }
      .controls { bottom: max(18px, env(safe-area-inset-bottom)); }
      .dpad { width: min(38vw, 170px); }
      .jump-btn { width: min(32vw, 150px); }
      .coach, .letter-card { top: 11%; }
      .rotate-tip { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" id="gameShell" aria-label="Lisa的字母冒险游戏">
    <div class="playfield" id="playfield">
      <canvas id="gameCanvas" width="1280" height="720" aria-label="横版闯关游戏画面"></canvas>
      <img class="hero-sprite" id="heroSprite" src="assets/lisa-hero-sprite.png?v=9" alt="" aria-hidden="true" draggable="false">
    </div>

    <div class="top-hud">
      <div class="hearts" id="hearts" role="status" aria-label="剩余五颗爱心">
        <span class="heart" aria-hidden="true">♥</span>
        <span class="heart" aria-hidden="true">♥</span>
        <span class="heart" aria-hidden="true">♥</span>
        <span class="heart" aria-hidden="true">♥</span>
        <span class="heart" aria-hidden="true">♥</span>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭声音">🔊</button>
        <button class="icon-btn" id="restartBtn" type="button" aria-label="重新开始本关">↻</button>
      </div>
    </div>

    <div class="level-pill" id="levelPill">第一关 · 字母森林 · A–E</div>
    <div class="coach" id="coach" aria-live="polite"></div>
    <div class="letter-card" id="letterCard" aria-live="polite">
      <strong class="letter-big" id="letterBig">A</strong>
      <div class="letter-copy">
        <span class="letter-word" id="letterWord">apple</span>
        <span class="letter-bonus" id="letterMeaning">苹果</span>
        <span class="letter-bonus" id="letterBonus" style="font-size:12px"></span>
      </div>
      <div class="doodle-frame">
        <span class="doodle-fallback" id="doodleFallback" hidden aria-hidden="true">🍎</span>
        <img class="letter-doodle" id="letterDoodle" src="assets/apple-small.png" alt="苹果手绘图" decoding="async">
      </div>
      <button class="letter-replay" id="replayLessonBtn" type="button">🔊 再听一次</button>
    </div>

    <div class="controls" aria-label="游戏控制按钮">
      <div class="dpad" aria-label="方向控制">
        <button class="control-btn" type="button" data-action="up" aria-label="向上">↑</button>
        <button class="control-btn" type="button" data-action="down" aria-label="向下">↓</button>
        <button class="control-btn" type="button" data-action="left" aria-label="向左">←</button>
        <button class="control-btn" type="button" data-action="right" aria-label="向右">→</button>
      </div>
      <button class="jump-btn" id="jumpBtn" type="button" aria-label="跳跃，长按跳得更高">↑</button>
    </div>

    <div class="rotate-tip">横过来，画面会更大哦 ↻</div>

    <section class="overlay" id="startOverlay">
      <div class="panel">
        <h1>Lisa的字母冒险</h1>
        <p>陪 Lisa 玩 10 关，听单词、认图画，发现 A–Z！</p>
        <button class="start-btn" id="startBtn" type="button">开始游戏</button>
        <div class="how">短按小跳 · 长按大跳</div>
      </div>
    </section>

    <section class="overlay hidden" id="finishOverlay" aria-live="polite">
      <div class="panel">
        <h2 id="finishTitle">太棒啦！</h2>
        <p id="finishText">Lisa找到了真正的城堡！</p>
        <button class="start-btn" id="againBtn" type="button">再玩一次</button>
      </div>
    </section>
  </main>

  <script src="audio/manifest.js"></script>
  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("gameCanvas");
      var ctx = canvas.getContext("2d");
      var heroSprite = document.getElementById("heroSprite");
      var W = 1280;
      var H = 720;
      var WORLD_W = 2480;
      var GROUND = 475;
      var LEVEL_THREE_GROUND = 606;
      var GRAVITY = 1650;
      var started = false;
      var paused = true;
      var won = false;
      var lastTime = 0;
      var worldTime = 0;
      var cameraX = 0;
      var currentLevel = 1;
      var MAX_HEARTS = 5;
      var soundEnabled = true;
      try { soundEnabled = localStorage.getItem("lisa-letter-sound-v2") !== "off"; } catch (error) { /* Storage is optional. */ }
      var audioContext = null;
      var audioReadyPromise = null;
      var speechPrimed = false;
      var coachTimer = 0;
      var letterCardTimer = 0;
      var speechRunId = 0;
      var lastLesson = null;
      var fakeHintShown = false;
      var ladderHintShown = false;
      var tunnelHintShown = false;
      var blueBlockHintShown = false;
      var machineSpringHintShown = false;
      var pendingResetTimer = null;
      var pendingFinishTimer = null;
      var confetti = [];
      var finale = { active: false, time: 0, next: 0, sparks: [], opened: false };
      var lessonAudioTimer = null;
      var audioCache = {};
      var narrationSource = null;
      var previousWords = {};
      var particles = [];

      var bgImage = new Image();
      bgImage.src = "assets/storybook-bg.webp";

      var input = {
        left: false,
        right: false,
        up: false,
        down: false,
        jump: false,
        jumpPressed: false
      };
      var inputSources = {};
      var controlResetters = [];

      var letterLessons = [
        ["A", "apple", "苹果", "🍎"], ["B", "ball", "皮球", "⚽"],
        ["C", "cat", "小猫", "🐱"], ["D", "dog", "小狗", "🐶"],
        ["E", "egg", "鸡蛋", "🥚"], ["F", "fish", "小鱼", "🐟"],
        ["G", "goat", "小山羊", "🐐"], ["H", "hat", "帽子", "👒"],
        ["I", "igloo", "冰屋", "🧊"], ["J", "jam", "果酱", "🍓"],
        ["K", "kite", "风筝", "🪁"], ["L", "lion", "小狮子", "🦁"],
        ["M", "moon", "月亮", "🌙"], ["N", "nest", "鸟巢", "🪺"],
        ["O", "octopus", "章鱼", "🐙"], ["P", "penguin", "企鹅", "🐧"],
        ["Q", "queen", "女王", "👑"], ["R", "rabbit", "兔子", "🐰"],
        ["S", "sun", "太阳", "☀️"], ["T", "turtle", "海龟", "🐢"],
        ["U", "umbrella", "雨伞", "☂️"], ["V", "violin", "小提琴", "🎻"],
        ["W", "whale", "鲸鱼", "🐳"], ["X", "xylophone", "木琴", "🎵"],
        ["Y", "yo-yo", "悠悠球", "🪀"], ["Z", "zebra", "斑马", "🦓"]
      ].map(function (item) {
        return { char: item[0], word: item[1], speech: item[1] + ".", meaning: item[2],
          art: "assets/" + item[1] + "-small.png", fallbackArt: "assets/" + item[1] + "-small.png",
          artAlt: item[2] + "手绘图", emoji: item[3] };
      });

        soundEnabled = enabled;
        if (!enabled) { speechRunId += 1; stopWordAudio(); }
        try { localStorage.setItem("lisa-letter-sound-v2", enabled ? "on" : "off"); } catch (error) { /* Keep playing without saved preferences. */ }
        var btn = document.getElementById("soundBtn");
        btn.textContent = enabled ? "🔊" : "🔇";
        btn.setAttribute("aria-label", enabled ? "关闭声音" : "打开声音");
        if (!enabled && "speechSynthesis" in window && window.speechSynthesis) {
          speechRunId += 1;
          try {
            if (typeof window.speechSynthesis.cancel === "function") window.speechSynthesis.cancel();
          } catch (error) {
            // Sound can still be muted even if the speech engine is unavailable.
          }
          speechPrimed = false;
        }
      }

      function rectOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function machineSpringTop() {
        return machineSpring.baseY - machineSpring.restHeight + machineSpring.compression;
      }

      function updateMachineSpring(dt) {
        var acceleration = -105 * machineSpring.compression - 11 * machineSpring.velocity;
        machineSpring.velocity += acceleration * dt;
        machineSpring.compression += machineSpring.velocity * dt;
        if (machineSpring.compression > 28) {
          machineSpring.compression = 28;
          machineSpring.velocity *= -.22;
        }
        if (machineSpring.compression < -8) {
          machineSpring.compression = -8;
          machineSpring.velocity *= -.22;
        }
        if (Math.abs(machineSpring.compression) < .03 && Math.abs(machineSpring.velocity) < .08) {
          machineSpring.compression = 0;
          machineSpring.velocity = 0;
        }
      }

      function bounceOnMachineSpring(prevBottom, newBottom) {
        var top = machineSpringTop();
        var horizontal = player.x + player.w > machineSpring.x + 5 &&
          player.x < machineSpring.x + machineSpring.w - 5;
        if (!horizontal || player.vy < 0 || prevBottom > top + 14 || newBottom < top) return false;

        machineSpring.compression = 24;
        machineSpring.velocity = 55;
        top = machineSpringTop();
        player.y = top - player.h;
        player.vy = -650;
        player.onGround = false;
        player.jumping = false;
        tone(300, .13, "square", .045);
        setTimeout(function () { tone(520, .16, "sine", .04); }, 70);
        burst(machineSpring.x + machineSpring.w / 2, top, "#e94e4f", 8);
        if (!machineSpringHintShown) {
          machineSpringHintShown = true;
          showCoach("弹簧会连续回弹，试着在上面跳一跳！", 2500);
        }
        return true;
      }

      function resolveBlueBlockHorizontal() {
        if (!rectOverlap(player, blueBlock)) return;
        var previousRight = player.prevX + player.w;
        var previousLeft = player.prevX;
        var blockRight = blueBlock.x + blueBlock.w;
        var wasAbove = player.prevY + player.h <= blueBlock.y + 8;
        if (wasAbove) return;

        if (previousRight <= blueBlock.x + 8 || player.vx > 0) {
          player.x = blueBlock.x - player.w;
        } else if (previousLeft >= blockRight - 8 || player.vx < 0) {
          player.x = blockRight;
        }
        player.vx = 0;
      }

      function roundedRectPath(context, x, y, w, h, r) {
        // Normalize signed dimensions before computing radii: browser Canvas
        // throws IndexSizeError for negative arcTo radii and aborts the frame.
        if (w < 0) { x += w; w = -w; }
        if (h < 0) { y += h; h = -h; }
        var radius = Math.max(0, Math.min(r, w / 2, h / 2));
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + w, y, x + w, y + h, radius);
        context.arcTo(x + w, y + h, x, y + h, radius);
        context.arcTo(x, y + h, x, y, radius);
        context.arcTo(x, y, x + w, y, radius);
        context.closePath();
      }

      function setCrouching(active) {
        if (active === player.crouching) return;
        var bottom = player.y + player.h;
        player.crouching = active;
        player.h = active ? player.crouchH : player.baseH;
        player.y = bottom - player.h;
      }

      function startJump() {
        if (paused || won) return;
        if (player.onGround || player.onLadder) {
          if (currentLevel === 1 && player.onLetter && letter.active) letter.collectOnLanding = true;
          player.onLetter = false;
          var jumpingFromBall = currentLevel === 2 && player.onBall;
          player.onLadder = false;
          player.onBall = false;
          player.riding = null;
          player.vy = -560;
          if (jumpingFromBall) player.vx = rollingBall.vx;
          player.onGround = false;
          player.jumping = true;
          player.jumpHold = 0;
          player.longJumpVoicePlayed = false;
          tone(430, .13, "sine", .07);
        }
      }

      function releaseJump() {
        var playShortVoice = player.jumping && !player.longJumpVoicePlayed;
        if (player.jumping && player.vy < -235) player.vy = -235;
        player.jumping = false;
        if (playShortVoice) cuteVoice("short");
      }

      function playHazardSound(kind) {
        if (kind === "fire") {
          tone(390, .09, "square", .055);
          setTimeout(function () { tone(235, .22, "sawtooth", .06); }, 55);
        } else if (kind === "lava") {
          tone(185, .18, "sawtooth", .055);
          setTimeout(function () { tone(120, .28, "triangle", .05); }, 90);
        } else if (kind === "rock") {
          tone(220, .08, "square", .05);
          setTimeout(function () { tone(168, .12, "triangle", .045); }, 55);
        }
      }

      function damage(reason, hazardKind) {
        if (player.invincible > 0 || won) return;
        player.invincible = 1.35;
        player.jumping = false;
        hearts -= 1;
        updateHearts(hearts, "hurt");
        tone(145, .32, "sawtooth", .08);
        playHazardSound(hazardKind);
        cuteVoice("hurt");
        burst(player.x + player.w / 2, player.y + player.h / 2, "#ff6670", 10);

        if (hearts <= 0) {
          paused = true;
          showCoach("爱心用完啦，马上再试一次！", 1800);
          pendingResetTimer = setTimeout(function () {
            resetLevel(true);
            paused = false;
          }, 1500);
        } else {
          showCoach(reason || "小心障碍！", 1500);
          player.h = player.baseH;
          player.crouching = false;
          player.vx = 0;
          player.vy = 0;
          if (currentLevel === 1) {
            player.x = checkpointX;
            player.y = GROUND - player.baseH;
          } else if (currentLevel === 2) {
            player.onBall = true;
            player.onGround = true;
            player.x = rollingBall.x - player.w / 2;
            player.y = rollingBall.y - rollingBall.r - player.h;
          } else {
            player.x = W / 2 - player.w / 2;
            player.y = LEVEL_THREE_GROUND - player.h;
            player.onGround = true;
          }
        }
      }

      function burst(x, y, color, count) {
        for (var i = 0; i < count; i += 1) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - .5) * 260,
            vy: -80 - Math.random() * 260,
            life: .7 + Math.random() * .5,
            maxLife: 1.2,
            color: color,
            size: 5 + Math.random() * 9
          });
        }
      }

      function rewardLesson(lesson, x, y) {
        if (learnedThisLevel[lesson.char]) return;
        lesson = chooseWord(lesson.char);
        learnedThisLevel[lesson.char] = true;
        updateLevelLabel();
        var healed = hearts < MAX_HEARTS;
        if (healed) {
          hearts += 1;
          updateHearts(hearts - 1, "heal");
        }
        showLetterLesson(lesson, healed);
        speakLesson(lesson);
        tone(660, .18, "sine", .07);
        setTimeout(function () { tone(880, .24, "sine", .06); }, 100);
        burst(x, y, healed ? "#ff6177" : "#ffd43f", 20);
      }

      function bumpLetter(box) {
        if (player.letterBumpCooldown > 0) return;
        var side = player.x + player.w / 2 < box.x + box.w / 2 ? -1 : 1;
        player.x = clamp(player.x + side * 12, currentLevel === 3 ? 24 : 0,
          (currentLevel === 3 ? W - 24 : WORLD_W) - player.w);
        player.vx = side * 135;
        player.letterBumpCooldown = .38;
        burst(player.x + player.w / 2, player.y + 30, "#fff2a3", 5);
        tone(510, .07, "sine", .025);
      }

      function learnLetter() {
        var lesson = lessonForLevel(1, letter.index);
        player.onLetter = false;
        letter.active = false;
        letter.respawn = .65;
        rewardLesson(lesson, letter.x + letter.w / 2, letter.y + letter.h / 2);
        letter.index += 1;
        if (letter.index >= LEVEL_LESSON_SETS[0].length) letter.done = true;
      }

      function finishLevel() {
        if (won) return;
        var remaining = LEVELS[currentLevel - 1].letters.split("").filter(function (char) { return !learnedThisLevel[char]; });
        if (remaining.length) {
          if (goalHintTimer <= 0) { showCoach("还有 " + remaining.join("、") + "，找齐它们再去下一关！", 3200); goalHintTimer = 4; }
          return;
        }
        won = true;
        paused = true;
        if (currentLevel === 10) {
          cameraX = WORLD_W - W;
          finale.active = true; finale.opened = true; finale.time = 0; finale.next = 0;
          showCoach("礼包打开啦！A–Z 送你一场字母烟花！", 6000);
        }
        for (var i = 0; i < 90; i += 1) {
          confetti.push({
            x: Math.random() * W,
            y: -20 - Math.random() * 260,
            vx: (Math.random() - .5) * 90,
            vy: 90 + Math.random() * 170,
            spin: Math.random() * Math.PI,
            spinV: (Math.random() - .5) * .2,
            color: ["#ff665c", "#ffd84f", "#4b9fe6", "#62c69f", "#b67be8"][i % 5],
            size: 7 + Math.random() * 10
          });
        }
        tone(523, .25, "sine", .08);
        setTimeout(function () { tone(659, .25, "sine", .08); }, 130);
        setTimeout(function () { tone(784, .5, "sine", .08); }, 260);
        pendingFinishTimer = setTimeout(function () {
          var finishTitle = document.getElementById("finishTitle");
          var finishText = document.getElementById("finishText");
          var againBtn = document.getElementById("againBtn");
          if (currentLevel < LEVELS.length) {
            finishTitle.textContent = LEVELS[currentLevel - 1].name + "完成！";
            finishText.textContent = "这关的字母都找齐啦！下一站：" + LEVELS[currentLevel].name;
            againBtn.textContent = "进入第 " + (currentLevel + 1) + " 关";
          } else {
            finishTitle.textContent = "十关都完成啦！";
            finishText.textContent = "Lisa和 A–Z 都见过两次面啦！再来一次新的冒险吧。";
            againBtn.textContent = "从第一关再玩一次";
          }
          document.getElementById("finishOverlay").classList.remove("hidden");
        }, currentLevel === 10 ? 7000 : 1400);
      }

      function updateLetter(dt) {
        if (!letter.active) {
          player.onLetter = false;
          if (letter.done) return;
          letter.respawn -= dt;
          if (letter.respawn <= 0) prepareNextLevelOneLetter();
          return;
        }

        var previousLetterX = letter.x;
        var previousLetterY = letter.y + Math.sin(letter.bob) * 7;
        var wasStanding = player.onLetter && player.vy >= 0 &&
          Math.abs(player.prevY + player.h - previousLetterY) <= 8;
        player.onLetter = false;
        letter.bob += dt * 4;
        letter.x += letter.vx * dt;
        if (letter.x < letter.homeX - 42) {
          letter.x = letter.homeX - 42;
          letter.vx = Math.abs(letter.vx);
        }
        if (letter.x > letter.homeX + 42) {
          letter.x = letter.homeX + 42;
          letter.vx = -Math.abs(letter.vx);
        }

        if (player.x > letter.homeX + 180) {
          // Bring a missed letter back; never silently skip its learning slot.
          letter.homeX = clamp(player.x + 95, 180, 1950);
          letter.x = letter.homeX;
          letter.y = 292;
        }

        var letterBox = {
          x: letter.x,
          y: letter.y + Math.sin(letter.bob) * 7,
          w: letter.w,
          h: letter.h
        };

        // Carry a standing rider through the gentle bob, including upward motion.
        // Without this, onGround could flicker and a jump press would be lost.
        if (wasStanding && player.x + player.w > previousLetterX &&
            player.x < previousLetterX + letter.w) {
          player.x += letter.x - previousLetterX;
          player.y = letterBox.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.onLetter = true;
          player.jumping = false;
          return;
        }

        if (rectOverlap(player, letterBox)) {
          var playerCenterY = player.y + player.h / 2;
          var letterCenterY = letterBox.y + letterBox.h / 2;
          if (player.vy < -40 && playerCenterY > letterCenterY) {
            player.vy = 120;
            player.jumping = false;
            learnLetter();
          } else if (player.vy >= 0 && player.prevY + player.h <= letterBox.y + 12) {
            player.y = letterBox.y - player.h;
            player.vy = 0;
            player.jumping = false;
            if (letter.collectOnLanding) {
              player.onGround = false;
              learnLetter();
            } else {
              player.onGround = true;
              player.onLetter = true;
            }
          } else {
            bumpLetter(letterBox);
          }
        }
      }

      function updatePlayer(dt) {
        player.prevX = player.x;
        player.prevY = player.y;
        var previousFootY = player.y + player.h;
        if (player.invincible > 0) player.invincible -= dt;

        var move = 0;
        if (input.left) move -= 1;
        if (input.right) move += 1;
        if (move !== 0) player.facing = move;

        var nearLadder = player.x + player.w > ladder.x - 20 &&
          player.x < ladder.x + ladder.w + 20 &&
          player.y + player.h > ladder.y - 20 &&
          player.y < GROUND;

        if (nearLadder && (input.up || input.down)) {
          player.onLadder = true;
          player.jumping = false;
        }

        if (player.onLadder) {
          player.vx = move * 120;
          player.vy = (input.down ? 1 : 0) * 175 - (input.up ? 1 : 0) * 175;
          player.x += player.vx * dt;
          player.y += player.vy * dt;
          player.x = clamp(player.x, ladder.x - 9, ladder.x + ladder.w - player.w + 9);
          player.y = clamp(player.y, ladder.y - player.h, GROUND - player.h);
          if (!nearLadder || input.jump) player.onLadder = false;
        } else {
          var speed = player.crouching ? 150 : 275;
          player.vx += (move * speed - player.vx) * Math.min(1, dt * 11);
          player.x += player.vx * dt;
          resolveBlueBlockHorizontal();

          var wantsCrouch = input.down && player.onGround;
          setCrouching(wantsCrouch);

          var wouldEnterTunnel = player.x + player.w > tunnel.x &&
            player.x < tunnel.x + tunnel.w &&
            player.y + player.h > tunnel.y;
          if (wouldEnterTunnel && !player.crouching) {
            if (player.vx > 0) player.x = tunnel.x - player.w;
            if (player.vx < 0) player.x = tunnel.x + tunnel.w;
            player.vx = 0;
            if (!tunnelHintShown) {
              tunnelHintShown = true;
              showCoach("按住 ↓ 蹲下来，钻过小通道！", 2600);
            }
          }

          if (input.jumpPressed) startJump();
          input.jumpPressed = false;

          if (input.jump && player.jumping && player.vy < 0 && player.jumpHold < .34) {
            player.vy -= 980 * dt;
            player.jumpHold += dt;
            if (player.jumpHold >= .18 && !player.longJumpVoicePlayed) {
              player.longJumpVoicePlayed = true;
              cuteVoice("long");
            }
          }

          player.vy += GRAVITY * dt;
          player.y += player.vy * dt;
          player.onGround = false;

          var prevBottom = previousFootY;
          var newBottom = player.y + player.h;
          var bouncedOnSpring = bounceOnMachineSpring(prevBottom, newBottom);
          if (!bouncedOnSpring) {
            for (var i = 0; i < landingSurfaces.length; i += 1) {
              var surface = landingSurfaces[i];
              var horizontal = player.x + player.w > surface.x + 5 && player.x < surface.x + surface.w - 5;
              if (horizontal && player.vy >= 0 && prevBottom <= surface.y + 8 && newBottom >= surface.y) {
                player.y = surface.y - player.h;
                player.vy = 0;
                player.onGround = true;
                player.jumping = false;
                break;
              }
            }
          }
        }

        player.x = clamp(player.x, 0, WORLD_W - player.w);

        if (player.onGround && player.x > 930) checkpointX = 940;
        if (player.onGround && player.x > 1760) checkpointX = 1768;

        if (rectOverlap(player, furnace)) damage("火炉很烫，要跳过去！", "fire");
        if (rectOverlap(player, triangleRock)) damage("小心黑色小石山，要跳过去！", "rock");

        if (player.x > 930 && player.x < 1160 && !blueBlockHintShown) {
          blueBlockHintShown = true;
          showCoach("蓝色方块是实体，要跳过去，也可以站上去！", 2600);
        }

        if (rectOverlap(player, spring) && player.vy >= 0 && player.prevY + player.h <= spring.y + 18) {
          player.y = spring.y - player.h;
          player.vy = -900;
          player.onGround = false;
          player.jumping = false;
          tone(320, .18, "square", .05);
          showCoach("弹簧把 Lisa 弹高啦！", 1500);
        }

        if (player.x + player.w > lava.x && player.x < lava.x + lava.w && player.y + player.h > lava.y - 2) {
          damage("下面是岩浆，不能碰！", "lava");
        }

        if (player.y > H + 120) damage("掉下去啦，再试一次！");

        if (rectOverlap(player, fakeFinish) && !fakeHintShown) {
          fakeHintShown = true;
          showCoach("这是假的终点！真正的城堡还在前面。", 3000);
        }

        if (player.x > 1230 && !ladderHintShown) {
          ladderHintShown = true;
          showCoach("靠近梯子，按 ↑ 或 ↓ 上下移动。", 2600);
        }

        if (rectOverlap(player, realFinish)) finishLevel();
      }

      function updateJumpHold(dt) {
        if (input.jumpPressed) startJump();
        input.jumpPressed = false;
        if (input.jump && player.jumping && player.vy < 0 && player.jumpHold < .34) {
          player.vy -= 980 * dt;
          player.jumpHold += dt;
          if (player.jumpHold >= .18 && !player.longJumpVoicePlayed) {
            player.longJumpVoicePlayed = true;
            cuteVoice("long");
          }
        }
      }

      function updateLevelTwo(dt) {
        player.prevX = player.x;
        player.prevY = player.y;
        if (player.invincible > 0) player.invincible -= dt;

        var move = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        if (move) player.facing = move;
        setCrouching(false);
        updateJumpHold(dt);

        var targetBallSpeed = player.onBall ? move * 245 : 0;
        var ballResponse = player.onBall ? 3.8 : .7;
        rollingBall.vx += (targetBallSpeed - rollingBall.vx) * Math.min(1, dt * ballResponse);
        rollingBall.x = clamp(rollingBall.x + rollingBall.vx * dt, 125, WORLD_W - 145);
        rollingBall.y = levelTwoGroundY(rollingBall.x) - rollingBall.r;
        rollingBall.rotation += rollingBall.vx * dt / rollingBall.r;
        rollingBall.squash += (Math.min(.055, Math.abs(rollingBall.vx) / 5200) - rollingBall.squash) * Math.min(1, dt * 7);

        if (player.onBall) {
          player.x = rollingBall.x - player.w / 2;
          player.y = rollingBall.y - rollingBall.r - player.h;
          player.vx = rollingBall.vx;
          player.vy = 0;
          player.onGround = true;
          player.jumping = false;
        } else {
          var targetPlayerSpeed = move * 265;
          player.vx += (targetPlayerSpeed - player.vx) * Math.min(1, dt * 9);
          player.x += player.vx * dt;
          player.vy += GRAVITY * dt;
          player.y += player.vy * dt;
          player.onGround = false;

          var playerCenterX = player.x + player.w / 2;
          var distanceX = playerCenterX - rollingBall.x;
          var ballReach = rollingBall.r - 8;
          if (Math.abs(distanceX) < ballReach) {
            var ballTop = rollingBall.y - Math.sqrt(ballReach * ballReach - distanceX * distanceX);
            var previousBottom = player.prevY + player.h;
            var currentBottom = player.y + player.h;
            if (player.vy >= 0 && previousBottom <= ballTop + 14 && currentBottom >= ballTop) {
              player.onBall = true;
              player.onGround = true;
              player.jumping = false;
              player.vy = 0;
              player.x = rollingBall.x - player.w / 2;
              player.y = rollingBall.y - rollingBall.r - player.h;
              rollingBall.squash = .12;
              burst(rollingBall.x, rollingBall.y - rollingBall.r + 4, "#f4dca0", 7);
              tone(410, .12, "sine", .045);
            }
          }

          if (!player.onBall) {
            var groundY = levelTwoGroundY(player.x + player.w / 2);
            if (player.y + player.h >= groundY && player.vy >= 0) {
              player.y = groundY - player.h;
              player.vy = 0;
              player.onGround = true;
              player.jumping = false;
            }
          }
        }

        player.x = clamp(player.x, 0, WORLD_W - player.w);
        rollingLetters.forEach(function (badge) {
          badge.bob += dt * 3.4;
          if (!badge.active) return;
          var badgeBox = {
            x: badge.x,
            y: badge.y + Math.sin(badge.bob) * 8,
            w: badge.w,
            h: badge.h
          };
          if (rectOverlap(player, badgeBox)) {
            badge.active = false;
            bumpLetter(badgeBox);
            rewardLesson(letterLessons[badge.lessonIndex], badgeBox.x + badgeBox.w / 2, badgeBox.y + badgeBox.h / 2);
          }
        });

        if (rollingBall.x > 2260 && player.onBall) finishLevel();
      }

      function catcherRect() {
        return {
          x: player.x - 27,
          y: player.y - meteorState.catcherLift - meteorState.basketBounce,
          w: player.w + 54,
          h: 28
        };
      }

      function spawnMeteor() {
        var levelSet = LEVEL_LESSON_SETS[2];
        var remaining = levelSet.filter(function (index) { return !learnedThisLevel[letterLessons[index].char]; });
        if (!remaining.length || meteorState.meteors.length >= 3) return;
        var hasLetter = meteorState.meteors.some(function (meteor) { return !meteor.rock && meteor.active; });
        var makeRock = hasLetter && meteorState.caught >= 2 && Math.random() < .25;
        if (hasLetter && !makeRock) return;
        var lessonIndex = remaining[0];
        meteorState.meteors.push({
          x: 90 + Math.random() * (W - 180),
          y: -56,
          size: makeRock ? 46 : 50,
          vx: (Math.random() - .5) * 46,
          vy: 112 + Math.random() * 48,
          rotation: (Math.random() - .5) * .5,
          spin: (Math.random() - .5) * 1.25,
          rock: makeRock,
          lessonIndex: lessonIndex,
          active: true
        });
      }

      function updateLevelThree(dt) {
        player.prevX = player.x;
        player.prevY = player.y;
        if (player.invincible > 0) player.invincible -= dt;

        var move = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        if (move) player.facing = move;
        setCrouching(false);
        updateJumpHold(dt);

        player.vx += (move * 300 - player.vx) * Math.min(1, dt * 11);

          ctx.globalAlpha = .28 + Math.sin(bubblePhase * Math.PI) * .62;

        ctx.globalAlpha = 1;

          ctx.globalAlpha = Math.sin(sparkPhase * Math.PI) * .9;
          ctx.fillStyle = spark % 2 ? "#fff07a" : "#ff7136";
          ctx.beginPath();
          ctx.arc(sparkX + Math.sin(worldTime * 3 + spark) * 6, sparkY, 3 + (spark % 2), 0, Math.PI * 2);

      function drawTunnel() {

        roundedRectPath(ctx, tunnel.x - 18, GROUND - 8, tunnel.w + 36, 20, 9);

        ctx.beginPath();
        ctx.moveTo(tunnel.x - 10, GROUND);
        ctx.lineTo(tunnel.x - 10, tunnel.y + 16);
        ctx.quadraticCurveTo(tunnel.x + tunnel.w / 2, archTop - 34, tunnel.x + tunnel.w + 10, tunnel.y + 16);
        ctx.lineTo(tunnel.x + tunnel.w + 10, GROUND);
        ctx.closePath();
        var stone = ctx.createLinearGradient(0, archTop, 0, GROUND);
        stone.addColorStop(0, "#9b8b7d");

        ctx.strokeStyle = "#443c3a";
        ctx.lineWidth = 6;
        ctx.stroke();

        var interior = ctx.createLinearGradient(tunnel.x + 14, 0, tunnel.x + tunnel.w - 14, 0);
        interior.addColorStop(0, "#1b1c24");
        interior.addColorStop(.48, "#080a10");
        interior.addColorStop(.82, "#24283a");

        roundedRectPath(ctx, tunnel.x + 15, openingTop, tunnel.w - 30, GROUND - openingTop + 3, 24);
        ctx.fill();

        for (var depth = 0; depth < 3; depth += 1) {
          ctx.strokeStyle = "rgba(143,132,128," + (.42 - depth * .075) + ")";
          ctx.lineWidth = 5 - depth * .55;
          var insetX = depth * 18;
          var insetY = depth * 3;
          roundedRectPath(ctx, tunnel.x + 24 + insetX, openingTop + 7 + insetY,
            tunnel.w - 48 - insetX * 2, GROUND - openingTop - 7 - insetY * 2, 18);
          ctx.stroke();
        }

        var exitGlow = ctx.createRadialGradient(tunnel.x + tunnel.w - 24, GROUND - 24, 2, tunnel.x + tunnel.w - 24, GROUND - 24, 48);

        ctx.fillStyle = "#657d50";

        ctx.strokeStyle = "rgba(179,211,222,.5)";
        ctx.lineWidth = 2;
        for (var drip = 0; drip < 3; drip += 1) {

        ctx.beginPath();
        ctx.arc(-24, -38, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.save();

        ctx.moveTo(-meteor.size * .32, -meteor.size * .34);
        ctx.quadraticCurveTo(-meteor.size * .2, -meteor.size * 1.45 * tailPulse, 0, -meteor.size * 1.05);
        ctx.quadraticCurveTo(meteor.size * .2, -meteor.size * 1.52 / tailPulse, meteor.size * .32, -meteor.size * .34);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = meteor.rock ? .42 : .76;
        ctx.fillStyle = meteor.rock ? "#c2beca" : "#ffd45b";
        ctx.beginPath();
        ctx.moveTo(-meteor.size * .17, -meteor.size * .35);
        ctx.quadraticCurveTo(0, -meteor.size * 1.12 * tailPulse, meteor.size * .17, -meteor.size * .35);

      function syncHeroSprite() {
        if (!heroSprite || !player || typeof player.x !== "number") return;
        var screenX = currentLevel === 3 ? player.x : player.x - cameraX;
        var footY = player.y + player.h;
        var moving = player.onGround && Math.abs(player.vx) > 28;
        var walkBob = moving ? Math.abs(Math.sin(worldTime * 11.5)) * 4 : Math.sin(worldTime * 2.2) * 1.2;
        var flicker = player.invincible > 0 && Math.floor(player.invincible * 14) % 2 === 0;
        heroSprite.style.left = ((screenX + player.w / 2) / W * 100) + "%";
        heroSprite.style.top = ((footY - walkBob + 8) / H * 100) + "%";
        heroSprite.style.height = ((player.h + 42) / H * 100) + "%";
        heroSprite.style.transform = "translate(-50%, -100%) scaleX(" + player.facing + ")";
        heroSprite.style.opacity = flicker ? "0" : "1";
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();
        drawSkyAccents();

        if (currentLevel === 1) {
          ctx.save();
          ctx.translate(-cameraX, 0);
          surfaces.forEach(drawGroundBlock);
          drawUndergroundCutaway();
          drawDeepLavaRiver();
          drawLava();
          drawLadder();
          drawFurnace();
          drawBlueBlock();
          drawSpring();
          drawMachineSpring();
          drawLetter();
          drawTunnel();
          drawTriangleRock();
          drawFakeFinish();
          drawCastle();
          drawPlayer();
          drawParticles();
          ctx.restore();
        } else if (currentLevel === 2) {
          ctx.save();
          ctx.translate(-cameraX, 0);
          drawLevelTwoWorld();
          ctx.restore();
        } else if (currentLevel === 3) {
          drawLevelThreeWorld();
        } else {
          ctx.save();
          ctx.translate(-cameraX, 0);
          drawAdventure();
          ctx.restore();
        }

        drawConfetti();
      }

      function loop(time) {
        var dt = lastTime ? Math.min(.033, (time - lastTime) / 1000) : 0;
        lastTime = time;
        update(dt);
        syncHeroSprite();
        draw();
        requestAnimationFrame(loop);
      }

      function setControl(action, source, held) {
        var sources = inputSources[action] || (inputSources[action] = {});
        if (held) sources[source] = true;
        else delete sources[source];
        var wasHeld = input[action];
        input[action] = Object.keys(sources).length > 0;
        if (action === "jump" && input[action] !== wasHeld) {
          if (input[action]) {
            input.jumpPressed = true;
            startJump();
          } else releaseJump();
        }
      }

      function clearControls() {
        inputSources = {};
        Object.keys(input).forEach(function (key) { input[key] = false; });
        controlResetters.forEach(function (reset) { reset(); });
        document.querySelectorAll(".active").forEach(function (node) { node.classList.remove("active"); });
        if (player.jumping && player.vy < -235) player.vy = -235;
        player.jumping = false;
      }

      function bindHoldButton(button, action) {
        var activePointerId = null;
        controlResetters.push(function () { activePointerId = null; });

        function eventPointerId(event) {
          if (event && event.pointerId !== undefined) return event.pointerId;
          if (event && event.changedTouches && event.changedTouches.length) return event.changedTouches[0].identifier;
          return "mouse";
        }

        function press(event) {
          event.preventDefault();
          var pointerId = eventPointerId(event);
          if (activePointerId !== null && activePointerId !== pointerId) return;
          activePointerId = pointerId;
          button.classList.add("active");
          setControl(action, "button", true);
          initAudio();
          if (button.setPointerCapture && event.pointerId !== undefined) {
            try { button.setPointerCapture(event.pointerId); } catch (error) { /* iPad can reject capture; input still works. */ }
          }
        }

        function release(event) {
          if (activePointerId === null) return;
          if (event && event.changedTouches) {
            var matchingTouch = Array.prototype.some.call(event.changedTouches, function (touch) {
              return touch.identifier === activePointerId;
            });
            if (!matchingTouch) return;
          } else if (event && eventPointerId(event) !== activePointerId) return;
          if (event) event.preventDefault();
          button.classList.remove("active");
          activePointerId = null;
          setControl(action, "button", false);
        }

        if ("PointerEvent" in window) {
          button.addEventListener("pointerdown", press, { passive: false });
          button.addEventListener("pointerup", release, { passive: false });
          button.addEventListener("pointercancel", release, { passive: false });
          button.addEventListener("lostpointercapture", release, { passive: false });
          window.addEventListener("pointerup", release, { passive: false });
          window.addEventListener("pointercancel", release, { passive: false });
        } else {
          button.addEventListener("touchstart", press, { passive: false });
          button.addEventListener("touchend", release, { passive: false });
          button.addEventListener("touchcancel", release, { passive: false });
          window.addEventListener("touchend", release, { passive: false });
          window.addEventListener("touchcancel", release, { passive: false });
          button.addEventListener("mousedown", press);
          window.addEventListener("mouseup", release);
        }
        button.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      }

      document.querySelectorAll(".control-btn").forEach(function (button) {
        bindHoldButton(button, button.getAttribute("data-action"));
      });
      bindHoldButton(document.getElementById("jumpBtn"), "jump");
      document.addEventListener("pointerdown", function () { initAudio(); }, { capture: true, once: true });

      var keyMap = {
        ArrowLeft: "left",
        KeyA: "left",
        ArrowRight: "right",
        KeyD: "right",
        ArrowUp: "up",
        KeyW: "up",
        ArrowDown: "down",
        KeyS: "down",
        Space: "jump",
        " ": "jump",
        Spacebar: "jump"
      };

      function actionFromKeyEvent(event) {
        var letterKey = String(event.key || "").toUpperCase();
        return keyMap[event.code] || keyMap[event.key] || keyMap["Key" + letterKey];
      }

      window.addEventListener("keydown", function (event) {
        var action = actionFromKeyEvent(event);
        if (!action) return;
        event.preventDefault();
        setControl(action, "key:" + (event.code || String(event.key).toLowerCase()), true);
        initAudio();
      }, { passive: false });

      window.addEventListener("keyup", function (event) {
        var action = actionFromKeyEvent(event);
        if (!action) return;
        event.preventDefault();
        setControl(action, "key:" + (event.code || String(event.key).toLowerCase()), false);
      }, { passive: false });

      window.addEventListener("blur", clearControls);
      document.addEventListener("visibilitychange", function () {
        clearControls();
        lastTime = 0;
      });

      document.getElementById("startBtn").addEventListener("click", function () {
        initAudio().then(function () {
          tone(520, .12, "sine", .045);
          setTimeout(function () { tone(720, .18, "sine", .04); }, 90);
        });
        currentLevel = 1;
        resetLevel(false);
        started = true;
        paused = false;
        document.getElementById("startOverlay").classList.add("hidden");
        showCoach("先试试 ← →，再短按或长按跳跃！", 3300);
      });

      document.getElementById("againBtn").addEventListener("click", function () {
        initAudio();
        currentLevel = currentLevel === LEVELS.length ? 1 : currentLevel + 1;
        resetLevel(true);
        paused = false;
      });

      document.getElementById("restartBtn").addEventListener("click", function () {
        initAudio();
        resetLevel(true);
        paused = !started;
      });

      document.getElementById("soundBtn").addEventListener("click", function () {
        var enabling = !soundEnabled;
        setSound(enabling);
        if (enabling) {
          initAudio().then(function () { tone(660, .18, "sine", .07); });
        }
      });

      document.getElementById("replayLessonBtn").addEventListener("click", function () {
        initAudio();
        if (lastLesson) speakLesson(lastLesson);
      });

      setSound(soundEnabled);
      resetLevel(false);
      heroSprite.addEventListener("error", function () {
        if (heroSprite.getAttribute("src").indexOf("lisa-hero-sprite.png") !== -1) {
          heroSprite.src = "assets/lisa-hero.webp?v=9";
        }
      });
      syncHeroSprite();
      requestAnimationFrame(loop);
    }());
  </script>
</body>
</html>
